name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium --only-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run web:build

      - name: Check web build boundary
        run: node scripts/check-web-build.mjs

      - name: Run browser tests
        run: npm run test:web

      - name: Run unit and regression tests
        run: npm test

      - name: Run persistence tests with isolated PostgreSQL 17
        run: npm run test:persistence

      - name: Run auth and API tests with isolated PostgreSQL 17
        run: npm run test:auth

      - name: Run security and secret checks
        run: npm run security:check

      - name: Audit dependencies
        run: npm run security:audit

      - name: Check whitespace errors
        run: git diff --check
